<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vocadada</title>

    <link data-trunk rel="rust" data-wasm-opt="2" />
    <link data-trunk rel="copy-file" href="web/manifest.json" />
    <link data-trunk rel="copy-file" href="web/sw.js" />
    <link data-trunk rel="copy-dir" href="web/icons" />
    <link data-trunk rel="copy-dir" href="web/fonts" />

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#7c4dff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vocadada" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff9f0;
            touch-action: manipulation;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font: bold 24px sans-serif;
            color: #7c4dff;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="vocadada_canvas"></canvas>
    <div id="loading">Loading Vocadada…</div>
    <script>
        if ("serviceWorker" in navigator && location.protocol !== "file:") {
            window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
        }
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist();
        }
    </script>
</body>
</html>
