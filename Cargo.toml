[package]
name = "vocadada"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"
miniz_oxide = "0.8"
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
# debug-embed: also embed the translations in debug builds (needed for the web, which has no file system).
rust-embed = { version = "8", features = ["debug-embed"] }
qrcode = { version = "0.14.1", default-features = false }
rqrr = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "5"
i18n-embed = { version = "0.16", features = ["desktop-requester"] }
# Reading pictures from the clipboard (egui only pastes text). Same version eframe already uses.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
i18n-embed = { version = "0.16", features = ["web-sys-requester"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d", "Clipboard", "Document", "Element", "HtmlCanvasElement", "HtmlMediaElement",
    "HtmlVideoElement", "ImageData", "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack",
    "Navigator", "Node", "Response", "Storage", "Window",
] }
js-sys = "0.3"

[build-dependencies]
fluent-syntax = "0.12"

[dev-dependencies]
fluent-syntax = "0.12"
