[package]
name = "vocadada"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
# debug-embed: also embed the translations in debug builds (needed for the web, which has no file system).
rust-embed = { version = "8", features = ["debug-embed"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "5"
i18n-embed = { version = "0.16", features = ["desktop-requester"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
i18n-embed = { version = "0.16", features = ["web-sys-requester"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Node", "Storage", "Window"] }

[dev-dependencies]
fluent-syntax = "0.12"
